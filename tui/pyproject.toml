[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketanalyst-tui"
version = "0.1.0"
description = "Terminal User Interface for PocketAnalyst"
authors = [{name = "Alex", email = "alex.ruperto@javierlabs.com"}]
requires-python = ">=3.11"
dependencies = [
    "textual",
    "rich", 
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pocketanalyst-tui = "pocketanalyst_tui.main:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config", 
    "--import-mode=importlib",
    "--tb=short"
]
testpaths = ["tests"]
pythonpath = ["src"]

# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# File logging
log_file = "../test-reports/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(funcName)s(): %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"


